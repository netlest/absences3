[project]
name = "frontend"
version = "0.1.0"
description = "CSS-grid absences calendar (FastAPI + Jinja2) — HTML replacement for image.py"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
