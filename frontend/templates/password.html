<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password — Absences Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#d8d0d8] font-['Fira_Code','Courier_New',monospace] p-4">

  <form method="post" action="/password"
        class="w-full max-w-sm bg-white/90 backdrop-blur border border-gray-300 shadow-sm rounded-lg p-6 space-y-4">
    <h1 class="text-lg font-medium text-gray-800">Change password</h1>

    {% if error %}
    <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2">{{ error }}</p>
    {% endif %}
    {% if done %}
    <p class="text-sm text-green-700 bg-green-50 border border-green-200 rounded-md px-3 py-2">Password changed.</p>
    {% endif %}

    <label class="block text-sm text-gray-700">
      Current password
      <input name="current_password" type="password" required autofocus autocomplete="current-password"
             class="mt-1 w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-1.5 text-gray-800">
    </label>

    <label class="block text-sm text-gray-700">
      New password
      <input name="new_password" type="password" required minlength="6" autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-1.5 text-gray-800">
    </label>

    <label class="block text-sm text-gray-700">
      Repeat new password
      <input name="confirm_password" type="password" required minlength="6" autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-1.5 text-gray-800">
    </label>

    <div class="flex gap-2">
      <button type="submit"
              class="flex-1 rounded-md border border-gray-300 bg-gray-50 px-3 py-1.5 text-gray-700 hover:bg-gray-200 transition-colors">
        Change password
      </button>
      <a href="/"
         class="flex-1 text-center rounded-md border border-gray-300 bg-gray-50 px-3 py-1.5 text-gray-700 hover:bg-gray-200 transition-colors">
        Back
      </a>
    </div>
  </form>

</body>
</html>
